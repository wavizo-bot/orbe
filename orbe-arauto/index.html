<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Orbe Arauto - Envio de Mensagens</title>
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <div class="container">
      <h1>Orbe Arauto</h1>
      <p class="subtitulo">Envio de mensagens aos responsáveis</p>

      <div class="input-area">
        <button id="btn-colar" class="btn-acao">↘️</button>
        <input
          type="text"
          id="input-codigo"
          placeholder="Insira aqui o código recebido"
        />
        <button id="btn-limpar" class="btn-acao">❌</button>
        <button id="btn-processar" class="btn-acao">✅</button>
        <button id="btn-recarregar" class="btn-acao">🔃</button>
      </div>

      <div id="cartoes-container"></div>

      <div id="modal-mensagem" class="modal escondido">
        <div class="modal-content">
          <h2 id="modal-titulo"></h2>
          <textarea id="modal-mensagem" rows="6" style="width: 100%;"></textarea>
          <div class="modal-botoes">
            <button id="modal-cancelar" class="btn-secondary">Cancelar</button>
            <button id="modal-enviar" class="btn-primary">Enviar</button>
          </div>
        </div>
      </div>

      <div id="banner" class="banner escondido"></div>
    </div>

    <footer class="rodape">
      Orbe Escolar versão 1.0.0 com banco de dados teste - Contato 11 978831938
    </footer>

    <script type="module" src="src/main.ts"></script>
  </body>
</html>
